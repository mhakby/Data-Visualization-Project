# Runs automatically on every pull request and on every push to main.
# A red cross on the PR means one of these steps failed. Click "Details" to see why.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Check code style (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest
